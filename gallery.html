<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Showcase</title>

<!--
  ============ CUSTOM FONTS: MONA SANS DISPLAY ============
  Each static weight is its own file, so each gets its own @font-face
  rule sharing the same font-family name. The browser picks the right
  file automatically based on the font-weight you set elsewhere.
-->
<style>
  @font-face {
    font-family: 'Mona Sans Display';
    src: url('fonts/MonaSansDisplay-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Mona Sans Display';
    src: url('fonts/MonaSansDisplay-Medium.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Mona Sans Display';
    src: url('fonts/MonaSansDisplay-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Mona Sans Display';
    src: url('fonts/MonaSansDisplay-ExtraBold.woff2') format('woff2');
    font-weight: 800;
    font-style: normal;
    font-display: swap;
  }
</style>

<style>
  :root{
    /* ============ YOUR BRAND COLORS ============ */
    --c-red:#ce0000;      /* Color 1 — primary accent: active tab, hover states, active dot */
    --c-cyan:#78dbff;     /* Color 2 — secondary accent: eyebrow label background */
    --c-ink:#1f1f1f;      /* Color 3 — text, arrows, borders, eyebrow label text */
    --c-white:#ffffff;    /* Color 4 — card + page surfaces */

    /* Derived tones (kept for contrast/readability, not new colors) */
    --c-ink-soft:rgba(31,31,31,.62);  /* body copy, softer than pure ink */
    --c-line:rgba(31,31,31,.14);      /* hairline borders */
    --c-tabs-bg:rgba(31,31,31,.06);   /* pill tray behind the tabs */

    /* ============ YOUR FONTS — EDIT FREELY ============ */
    /* Fall back to system fonts until your real files are uploaded and
       the @font-face blocks above point to them. Once ready, change the
       first name in each stack to match your @font-face font-family. */
    --font-heading:'Mona Sans Display', 'Helvetica Neue', Arial, sans-serif;
    --font-body:'Mona Sans Display', 'Helvetica Neue', Arial, sans-serif;

    --tab-size:16px;      --tab-tracking:1px;    --tab-leading:1;      --tab-weight:700;
    --kicker-size:14px;   --kicker-tracking:.06em; --kicker-leading:1; --kicker-weight:500;
    --title-size:20px;    --title-tracking:0;    --title-leading:1.3;   --title-weight:800;
    --body-size:18px;     --body-tracking:1px;   --body-leading:1.6;

    --radius:14px;

    /* number of grid columns per slide — change here if needed */
    --cols:2;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:transparent !important;
    font-family:var(--font-body);
    color:var(--c-ink);
    -webkit-font-smoothing:antialiased;
  }
  body{
    width:100%;
    min-height:100vh;
    padding:28px 24px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex;
    gap:8px;
    background:var(--c-tabs-bg);
    padding:6px;
    border-radius:999px;
    margin-bottom:34px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .tab{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    border:none;
    background:transparent;
    font-family:var(--font-heading);
    font-weight:var(--tab-weight);
    font-size:var(--tab-size);
    letter-spacing:var(--tab-tracking);
    line-height:var(--tab-leading);
    text-transform:uppercase;
    color:var(--c-ink);
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition:background .25s ease, color .25s ease;
    white-space:nowrap;
  }
  .tab-icon{
    flex:0 0 auto;
    width:15px;
    height:15px;
    display:inline-block;
    color:var(--c-red);
    transition:color .25s ease;
  }
  .tab-icon svg{ width:100%; height:100%; display:block; }
  .tab:hover{ color:var(--c-red); }
  .tab.active{
    background:var(--c-red);
    color:var(--c-white);
  }
  .tab.active .tab-icon{ color:var(--c-white); }

  /* ---------- Stage ---------- */
  .stage{
    width:100%;
    max-width:1160px;
    margin:0 auto;
    padding:0 68px;
    position:relative;
  }
  .panel{
    display:none;
    opacity:0;
    transition:opacity .4s ease;
  }
  .panel.active{ display:block; }
  .panel.visible{ opacity:1; }

  .slide-viewport{
    overflow:hidden;
    width:100%;
  }
  .slide-track{
    display:flex;
    transition:transform .9s cubic-bezier(.65,0,.35,1);
  }
  .slide{
    flex:0 0 100%;
    display:grid;
    grid-template-columns:repeat(var(--cols),1fr);
    gap:22px;
    padding:2px;
  }

  .card{
    background:var(--c-white);
    border:1px solid var(--c-line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:100%;
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .card .thumb{
    aspect-ratio:4/3;
    width:100%;
    display:block;
    object-fit:cover;
    background:var(--c-tabs-bg);
  }
  .card .body{
    padding:16px 16px 20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    flex:1;
  }
  .card .kicker{
    display:inline-block;
    font-family:var(--font-body);
    font-size:var(--kicker-size);
    letter-spacing:var(--kicker-tracking);
    line-height:var(--kicker-leading);
    text-transform:uppercase;
    font-weight:var(--kicker-weight);
    color:var(--c-ink);
    background:var(--c-cyan);
    padding:5px 12px;
    border-radius:12px;
    width:fit-content;
  }
  .card h3{
    font-family:var(--font-heading);
    font-size:var(--title-size);
    font-weight:var(--title-weight);
    letter-spacing:var(--title-tracking);
    line-height:var(--title-leading);
    text-transform:uppercase;
    margin:0;
    color:var(--c-ink);
  }
  .card p{
    font-family:var(--font-body);
    font-size:var(--body-size);
    letter-spacing:var(--body-tracking);
    line-height:var(--body-leading);
    color:var(--c-ink-soft);
    margin:0;
  }

  /* ---------- Arrows ---------- */
  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:52px;
    height:52px;
    border-radius:50%;
    border:none;
    background:var(--c-ink);
    color:var(--c-white);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
    transition:background .2s ease, transform .2s ease;
  }
  .nav-btn svg{ width:22px; height:22px; }
  .nav-btn:hover{ background:var(--c-red); transform:translateY(-50%) scale(1.06); }
  .nav-btn:active{ transform:translateY(-50%) scale(.96); }
  .nav-btn.prev{ left:0; }
  .nav-btn.next{ right:0; }
  .nav-btn[disabled]{ opacity:.28; cursor:default; }
  .nav-btn[disabled]:hover{ background:var(--c-ink); transform:translateY(-50%); }

  /* ---------- Dots ---------- */
  .dots{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-top:22px;
  }
  .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--c-line);
    border:none;
    cursor:pointer;
    padding:0;
    transition:background .2s ease, width .2s ease;
  }
  .dot.active{ background:var(--c-red); width:20px; border-radius:4px; }

  /* ---------- Click-to-preview ---------- */
  .card .thumb{ cursor: zoom-in; }
  #preview-backdrop{
    position:fixed;
    inset:0;
    z-index:998;
    pointer-events:none;
  }
  #preview-backdrop.visible{ pointer-events:auto; }
  #hover-preview{
    position:fixed;
    top:50%; left:50%;
    z-index:999;
    pointer-events:none;
    opacity:0;
    transform:translate(-50%,-50%) scale(.96);
    transition:opacity .18s ease, transform .18s ease;
    background:var(--c-white);
    border-radius:10px;
    box-shadow:0 18px 45px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.12);
    padding:6px;
    width:720px;
    max-width:90vw;
  }
  #hover-preview.visible{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  #hover-preview-scroll{
    max-height:90vh;
    overflow-y:auto;
    overscroll-behavior:contain;
    border-radius:6px;
  }
  #hover-preview img{
    display:block;
    width:100%;
    height:auto;
    border-radius:6px;
  }
  #hover-preview-close{
    position:absolute;
    top:14px;
    right:14px;
    width:32px;
    height:32px;
    border:none;
    border-radius:50%;
    background:var(--c-ink);
    color:var(--c-white);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:1;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
    transition:background .2s ease;
  }
  #hover-preview-close:hover{ background:var(--c-red); }
  #hover-preview-close svg{ width:16px; height:16px; display:block; }

  /* On small screens, use more of the viewport width/height. */
  @media (max-width:640px){
    #hover-preview{ width:92vw; }
    #hover-preview-scroll{ max-height:90vh; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 560px){
    .slide{ grid-template-columns:1fr; gap:16px; }
    .tabs{ width:100%; }
    .tab{ flex:1; padding:10px 10px; font-size:11.5px; }
    body{ padding:20px 12px 32px; }
    .stage{ padding:0 16px; }
    .nav-btn{ width:44px; height:44px; }
    .nav-btn.prev{ left:4px; }
    .nav-btn.next{ right:4px; }
  }
</style>
</head>
<body>

<div class="tabs" role="tablist" aria-label="Design categories">
  <button class="tab active" data-target="all" role="tab" aria-selected="true">All Projects</button>
  <button class="tab" data-target="funnel" role="tab" aria-selected="false">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 4h18l-7 9v6l-4 2v-8L3 4z"/>
      </svg>
    </span>
    Funnel Designs
  </button>
  <button class="tab" data-target="web" role="tab" aria-selected="false">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="4.5" width="19" height="15" rx="2"/>
        <line x1="2.5" y1="9" x2="21.5" y2="9"/>
        <circle cx="5.5" cy="6.75" r="0.6" fill="currentColor" stroke="none"/>
        <circle cx="7.8" cy="6.75" r="0.6" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    Web Designs
  </button>
</div>

<div class="stage">
  <button class="nav-btn prev" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </button>
  <button class="nav-btn next" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </button>

  <div id="panel-all" class="panel active visible">
    <div class="slide-viewport"><div class="slide-track"></div></div>
    <div class="dots"></div>
  </div>
  <div id="panel-funnel" class="panel">
    <div class="slide-viewport"><div class="slide-track"></div></div>
    <div class="dots"></div>
  </div>
  <div id="panel-web" class="panel">
    <div class="slide-viewport"><div class="slide-track"></div></div>
    <div class="dots"></div>
  </div>
</div>

<div id="preview-backdrop"></div>
<div id="hover-preview" aria-hidden="true">
  <button id="hover-preview-close" type="button" aria-label="Close preview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>
  </button>
  <div id="hover-preview-scroll"><img alt=""></div>
</div>

<script>
/* ---------------------------------------------------------------
   REPLACE the image src, title and paragraph text below with your
   own content. "img" accepts any image URL (upload your images
   somewhere and paste the link here).

   The floating hover popup automatically looks for a full-size
   version of each image named with a "-full" suffix in the same
   folder, e.g. "images/web1.webp" -> "images/web1-full.webp".
   You don't need to add anything per item — just make sure that
   "-full" file exists alongside the thumbnail. If it's missing,
   the popup falls back to the thumbnail itself.

   (You can still override this for a single item by adding a
   "preview" field with an exact path, which always wins.)

   Funnel Designs and Web Designs are locked to exactly 2 slides
   each (2 items per slide x 2 slides = 4 items). If you add or
   remove items, keep each list at 4 items to stay at 2 slides.
--------------------------------------------------------------- */
const FUNNEL_ITEMS = [
  { img:"images/funnel1-placeholder.webp", kicker:"Funnel design", title:"HVAC Services", text:"A 3-step booking flow built to turn local HVAC traffic into qualified service leads." },
  { img:"images/funnel2-placeholder.webp", kicker:"Funnel design", title:"Beauty Salon", text:"Landing, booking and confirmation pages designed to turn beauty traffic into clients." },
  { img:"images/funnel3-placeholder.webp", kicker:"Funnel design", title:"Landromat", text:"A streamlined booking flow built to turn laundry needs into new and returning customers." },
  { img:"images/funnel4-placeholder.webp", kicker:"Funnel design", title:"Coaching", text:"Application-style funnel that pre-qualifies coaching leads before a strategy call." }
];

const WEB_ITEMS = [
  { img:"images/web1-placeholder.webp", kicker:"Web design", title:"Cafe Bistro", text:"A welcoming website designed to highlight your menu, atmosphere, and make dining easy." },
  { img:"images/web2-placeholder.webp", kicker:"Web design", title:"Building Consultant", text:"Credible online presence built to highlight building expertise, services, and project experience." },
  { img:"images/web3-placeholder.webp", kicker:"Web design", title:"Personal Trainer", text:"Fitness-focused website designed to turn fitness expertise into loyal, committed clients." },
  { img:"images/web4-placeholder.webp", kicker:"Web design", title:"Real Estate", text:"Property-focused website crafted to build trust, attract buyers, and drive real estate inquiries." }
];

const ALL_ITEMS = [...FUNNEL_ITEMS, ...WEB_ITEMS];

const DATA = { all: ALL_ITEMS, funnel: FUNNEL_ITEMS, web: WEB_ITEMS };
const PER_SLIDE = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--cols'), 10) || 2;

function chunk(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}

/* Derives "images/web1.webp" -> "images/web1-full.webp" so you don't
   have to type a "preview" path for every item by hand. */
function deriveFullSrc(src){
  const dot = src.lastIndexOf('.');
  if (dot === -1) return src + '-full';
  return src.slice(0, dot) + '-full' + src.slice(dot);
}

function cardHTML(item){
  const previewSrc = item.preview || deriveFullSrc(item.img);
  return `<div class="card">
    <img class="thumb" src="${item.img}" data-preview="${previewSrc}" alt="${item.title}" loading="lazy">
    <div class="body">
      <span class="kicker">${item.kicker}</span>
      <h3>${item.title}</h3>
      <p>${item.text}</p>
    </div>
  </div>`;
}

function buildPanel(key){
  const panel = document.getElementById('panel-' + key);
  const track = panel.querySelector('.slide-track');
  const dotsWrap = panel.querySelector('.dots');
  const slides = chunk(DATA[key], PER_SLIDE);

  track.innerHTML = slides.map(group =>
    `<div class="slide">${group.map(cardHTML).join('')}</div>`
  ).join('');

  dotsWrap.innerHTML = slides.map((_, i) =>
    `<button class="dot${i===0?' active':''}" data-index="${i}" aria-label="Go to slide ${i+1}"></button>`
  ).join('');

  panel._slideCount = slides.length;
  panel._current = 0;
}

['all','funnel','web'].forEach(buildPanel);

/* Warm the browser cache for every "-full" preview image shortly after
   load, so clicking a thumbnail later shows the popup instantly instead
   of waiting on a network fetch. */
function preloadFullImages(){
  const seen = new Set();
  document.querySelectorAll('.thumb').forEach(t => {
    const src = t.dataset.preview;
    if (src && !seen.has(src)) {
      seen.add(src);
      const img = new Image();
      img.src = src;
    }
  });
}
if ('requestIdleCallback' in window) {
  requestIdleCallback(preloadFullImages);
} else {
  setTimeout(preloadFullImages, 500);
}

const tabs = document.querySelectorAll('.tab');
const prevBtn = document.querySelector('.nav-btn.prev');
const nextBtn = document.querySelector('.nav-btn.next');

function activePanel(){
  return document.querySelector('.panel.active');
}

function renderPosition(panel){
  const track = panel.querySelector('.slide-track');
  track.style.transform = `translateX(-${panel._current * 100}%)`;
  panel.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === panel._current);
  });
  prevBtn.disabled = panel._current === 0;
  nextBtn.disabled = panel._current === panel._slideCount - 1;
}

function goTo(panel, index){
  const max = panel._slideCount - 1;
  panel._current = Math.max(0, Math.min(max, index));
  renderPosition(panel);
}

/* Fade the old category out, then fade the new one in */
function switchPanel(target){
  const newPanel = document.getElementById('panel-' + target);
  const oldPanel = activePanel();
  if(!oldPanel || oldPanel === newPanel) return;

  oldPanel.classList.remove('visible');
  setTimeout(() => {
    oldPanel.classList.remove('active');
    newPanel.classList.add('active');
    newPanel._current = 0;
    void newPanel.offsetWidth;
    requestAnimationFrame(() => {
      newPanel.classList.add('visible');
      renderPosition(newPanel);
      notifyHeight();
      updateArrowOverlay();
    });
  }, 400);
}

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    if(tab.classList.contains('active')) return;
    tabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
    tab.classList.add('active'); tab.setAttribute('aria-selected','true');
    switchPanel(tab.dataset.target);
  });
});

prevBtn.addEventListener('click', () => {
  const p = activePanel();
  goTo(p, p._current - 1);
  updateArrowOverlay();
});
nextBtn.addEventListener('click', () => {
  const p = activePanel();
  goTo(p, p._current + 1);
  updateArrowOverlay();
});

document.querySelectorAll('.dots').forEach(wrap => {
  wrap.addEventListener('click', (e) => {
    const btn = e.target.closest('.dot');
    if(!btn) return;
    goTo(activePanel(), parseInt(btn.dataset.index, 10));
  });
});

renderPosition(activePanel());

/* On mobile, overlay the arrows so they sit half on top of the image
   (like a typical carousel), instead of centered on the whole card. */
function updateArrowOverlay(){
  const isMobile = window.matchMedia('(max-width: 560px)').matches;
  if(!isMobile){
    prevBtn.style.top = '';
    nextBtn.style.top = '';
    return;
  }
  const panel = activePanel();
  const thumb = panel.querySelector('.thumb');
  const stage = document.querySelector('.stage');
  if(!thumb || !stage) return;
  const thumbRect = thumb.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const top = (thumbRect.top - stageRect.top) + (thumbRect.height / 2);
  prevBtn.style.top = top + 'px';
  nextBtn.style.top = top + 'px';
}

function notifyHeight(){
  const h = document.body.scrollHeight;
  parent.postMessage({ type: 'iframeHeight', height: h }, '*');
  updateArrowOverlay();
}
window.addEventListener('load', notifyHeight);
window.addEventListener('resize', notifyHeight);
document.querySelectorAll('.thumb').forEach(img => {
  img.addEventListener('load', updateArrowOverlay);
});

/* ---------------------------------------------------------------
   Click-to-preview: hovering a thumbnail just shows a zoom cursor.
   Clicking it opens a larger version centered on screen, with a
   light dimmed backdrop behind it. Closed via the × button, the
   backdrop, or the Escape key.
--------------------------------------------------------------- */
{
  const backdrop = document.getElementById('preview-backdrop');
  const preview = document.getElementById('hover-preview');
  const previewScroll = document.getElementById('hover-preview-scroll');
  const previewImg = preview.querySelector('img');
  const closeBtn = document.getElementById('hover-preview-close');
  let activeThumb = null;

  function hidePreview(){
    activeThumb = null;
    preview.classList.remove('visible');
    backdrop.classList.remove('visible');
  }

  document.addEventListener('click', (e) => {
    const thumb = e.target.closest('.thumb');
    if (!thumb) return;

    const fullSrc = thumb.dataset.preview;
    if (!fullSrc) return; // no "-full" file configured for this item

    // Only show the preview once the full-size image is confirmed to load.
    const probe = new Image();
    probe.onload = () => {
      activeThumb = thumb;
      previewImg.src = fullSrc;
      previewImg.alt = thumb.alt || '';
      previewScroll.scrollTop = 0; // always start at the top of the image
      preview.classList.add('visible');
      backdrop.classList.add('visible');
    };
    probe.src = fullSrc;
  });

  // The backdrop sits behind the popup and covers the full viewport,
  // so clicking anywhere outside the popup reliably closes it.
  backdrop.addEventListener('click', hidePreview);

  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    hidePreview();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && activeThumb) hidePreview();
  });

  // This page is likely embedded in an iframe. A click outside the
  // iframe (on the parent page) can't be seen directly from in here,
  // but it does blur this window — so use that as the outside-click signal.
  window.addEventListener('blur', () => {
    if (activeThumb) hidePreview();
  });
}
</script>

</body>
</html>
