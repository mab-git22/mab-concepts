<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Testimonials</title>
<style>
  :root{
    --ink:#1f1f1f;
    --red:#ea2a2a;
    --grey:#7f7f7f;
    --white:#ffffff;
    --box:#f6f6f8;
  }
  @font-face{
    font-family:'Mona Sans Display';
    src:url('https://mab-git22.github.io/mab-concepts/fonts/MonaSansDisplay-Regular.woff2') format('woff2');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'Mona Sans Display';
    src:url('https://mab-git22.github.io/mab-concepts/fonts/MonaSansDisplay-Bold.woff2') format('woff2');
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Arial, Helvetica, sans-serif;
    background:transparent;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Background scene ---------- */
  @keyframes stageFadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  .stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:24px 20px 40px;
    background:transparent;
    opacity:0;
    animation:stageFadeIn .9s ease forwards;
  }

  /* ---------- Carousel ---------- */
  .carousel{
    position:relative;
    z-index:2;
    width:100%;
    max-width:1220px;
  }

  .carousel-viewport{
    position:relative;
    overflow-x:hidden;
    overflow-y:visible;
    width:100%;
  }

  .carousel-track{
    display:flex;
    transition:transform .75s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }

  .slide{
    flex:0 0 100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:34px;
    padding:46px 40px;
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--box);
    color:var(--ink);
    border-radius:6px;
    border:1px solid rgba(234,42,42,.35);
    padding:34px 32px 28px;
    display:flex;
    flex-direction:column;
    box-shadow:0 25px 50px -12px rgba(0,0,0,.28), 0 8px 22px rgba(0,0,0,.16);
    transition:transform .28s ease, box-shadow .28s ease;
    cursor:default;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 32px 60px -10px rgba(0,0,0,.32), 0 12px 28px rgba(234,42,42,.18);
  }

  .card-top{
    display:flex;
    align-items:flex-start;
    gap:24px;
  }

  .avatar{
    width:160px;
    height:160px;
    min-width:160px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--grey),#3a3a3a);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Mona Sans Display','Segoe UI',Arial,sans-serif;
    font-weight:700;
    font-size:36px;
    color:var(--white);
    letter-spacing:.5px;
    overflow:hidden;
    border:3px solid #ffffff;
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .card-copy{flex:1;}

  .stars{
    color:var(--red);
    font-size:22px;
    letter-spacing:5px;
    margin-bottom:14px;
  }

  .quote{
    font-family:'Mona Sans Display','Segoe UI',Arial,sans-serif;
    font-weight:400;
    font-size:16px;
    letter-spacing:1px;
    line-height:1.6em;
    color:#3a3a3a;
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .read-more{
    display:inline-block;
    margin-top:6px;
    font-size:14px;
    font-weight:600;
    color:var(--red);
    text-decoration:none;
    cursor:pointer;
    border-bottom:1px solid transparent;
    transition:border-color .2s ease;
  }
  .read-more:hover{border-color:var(--red);}

  .divider{
    width:46px;
    height:3px;
    background:var(--red);
    margin:22px 0 14px 20px;
    border-radius:2px;
  }

  .person{
    position:relative;
    display:inline-block;
    width:fit-content;
    margin-left:20px;
  }
  .person-name{
    font-family:'Mona Sans Display','Segoe UI',Arial,sans-serif;
    font-weight:700;
    text-transform:uppercase;
    font-size:18px;
    line-height:1.6em;
    letter-spacing:1px;
    color:var(--ink);
    cursor:pointer;
    position:relative;
  }
  .person-role{
    font-size:14px;
    line-height:1.6em;
    letter-spacing:1px;
    color:var(--grey);
    margin-top:2px;
  }

  /* chat bubble on name hover */
  .bubble{
    position:absolute;
    left:50%;
    bottom:calc(100% + 12px);
    transform:translateX(-50%) translateY(6px) scale(.92);
    background:var(--ink);
    color:var(--white);
    padding:8px 14px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:600;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    z-index:5;
  }
  .bubble::after{
    content:"";
    position:absolute;
    top:100%;
    left:50%;
    transform:translateX(-50%);
    border:6px solid transparent;
    border-top-color:var(--ink);
  }
  .person-name:hover .bubble,
  .person-name.show-bubble .bubble{
    opacity:1;
    transform:translateX(-50%) translateY(0) scale(1);
  }

  /* ---------- Nav arrows ---------- */
  .nav-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:transparent;
    border:none;
    width:52px;
    height:52px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:10;
    color:var(--red);
    opacity:.85;
    transition:opacity .2s ease, transform .2s ease;
  }
  .nav-arrow:hover{opacity:1; transform:translateY(-50%) scale(1.1);}
  .nav-arrow svg{width:26px;height:26px;}
  #prevBtn{left:-56px;}
  #nextBtn{right:-56px;}

  .dots{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-top:4px;
    position:relative;
    z-index:2;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#ffffff;
    border:1px solid rgba(31,31,31,.18);
    cursor:pointer;
    transition:background .2s ease, transform .2s ease;
  }
  .dot.active{background:var(--red); border-color:var(--red); transform:scale(1.2);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(31,31,31,.72);
    backdrop-filter:blur(3px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease;
    padding:24px;
  }
  .modal-overlay.open{opacity:1; pointer-events:auto;}

  .modal-card{
    background:var(--box);
    color:var(--ink);
    border-radius:8px;
    max-width:560px;
    width:100%;
    padding:40px 38px 34px;
    position:relative;
    border:1px solid rgba(234,42,42,.4);
    box-shadow:0 30px 70px rgba(0,0,0,.5);
    transform:translateY(14px) scale(.97);
    transition:transform .25s ease;
  }
  .modal-overlay.open .modal-card{transform:translateY(0) scale(1);}

  .modal-close{
    position:absolute;
    top:16px;
    right:18px;
    background:none;
    border:none;
    font-size:22px;
    line-height:1;
    color:var(--grey);
    cursor:pointer;
  }
  .modal-close:hover{color:var(--red);}

  .modal-card .quote{
    -webkit-line-clamp:unset;
    overflow:visible;
    font-size:16px;
  }

  /* Tablet */
  @media (max-width:1024px){
    .stage{padding:24px 46px 40px;}
    .carousel{max-width:100%;}
    #prevBtn{left:-38px;}
    #nextBtn{right:-38px;}
    .slide{gap:22px; padding:38px 30px;}
    .card{padding:28px 24px 22px;}
    .avatar{width:132px;height:132px;min-width:132px;font-size:30px;}
    .quote{font-size:15px; line-height:1.5em;}
    .person-name{font-size:16px; line-height:1.5em;}
    .person-role{font-size:12px; line-height:1.4em;}
  }

  @media (max-width:820px){
    .stage{padding:20px 20px 36px;}
    .slide{gap:18px; padding:34px 24px;}
    #prevBtn{left:2px;}
    #nextBtn{right:2px;}
    .nav-arrow{width:36px;height:36px;background:rgba(255,255,255,.7);border-radius:50%;box-shadow:0 4px 14px rgba(0,0,0,.15);}
    .nav-arrow svg{width:20px;height:20px;}
  }

  /* Mobile */
  @media (max-width:600px){
    .stage{padding:18px 14px 34px;}
    .slide{grid-template-columns:1fr; gap:20px; padding:30px 34px;}
    .card{padding:24px 20px 20px;}
    .card-top{gap:16px;}
    .avatar{width:108px;height:108px;min-width:108px;font-size:24px;}
    .stars{font-size:19px;}
    #prevBtn{left:-4px;}
    #nextBtn{right:-4px;}
    .nav-arrow{width:32px;height:32px;}
    .nav-arrow svg{width:18px;height:18px;}
  }

  @media (prefers-reduced-motion: reduce){
    .carousel-track, .card, .bubble, .modal-card, .modal-overlay{transition:none !important;}
    .stage{animation:none !important; opacity:1 !important;}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="carousel">
    <button class="nav-arrow" id="prevBtn" aria-label="Previous testimonials">
      <svg viewBox="0 0 24 24" fill="none"><path d="M15 5L8 12L15 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="carousel-viewport">
      <div class="carousel-track" id="track"></div>
    </div>

    <button class="nav-arrow" id="nextBtn" aria-label="Next testimonials">
      <svg viewBox="0 0 24 24" fill="none"><path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="dots" id="dots"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
  </div>
</div>

<script>
  const IMG_BASE = "https://mab-git22.github.io/mab-concepts/";

  const testimonials = [
    {
      image: IMG_BASE + "images/home-service-review.webp",
      name:"Tobias Lindberg",
      role:"Owner, Lindberg Home Services",
      text:"Before working with MAB Concepts, our website was basically just sitting there. After the redesign, we finally had a page that clearly explained our services and helped generate more inquiries. The whole process was smooth from the first call to launch, and the support didn't stop once the site went live."
    },
    {
      image: IMG_BASE + "images/real-estate-review.webp",
      name:"Sarah Mitchell",
      role:"Real Estate Agent | Consultant",
      text:"Michael made me the entire process simple. He understood my work, improved my online presence, and built something that actually helped my clients take the next step after visiting my page. I've since referred three other agents in my office who all had the same experience."
    },
    {
      image: IMG_BASE + "images/hvac-solutions-review.webp",
      name:"Carlos Whitfield",
      role:"Owner, Whitfield HVAC Solutions",
      text:"Our old site never showed up when people searched for emergency repairs. MAB Concepts rebuilt it from the ground up and made sure it actually ranked. We're getting service calls from the website every single week now, which almost never happened before."
    },
    {
      image: IMG_BASE + "img-female-placeholder.webp",
      name:"Isabella Cruz",
      role:"Owner, Cruz Med Spa & Wellness",
      text:"I wanted a site that felt as calming as the treatments we offer, and that's exactly what we got. Booking requests come in directly through the new site now, and clients tell me it was what convinced them to try us in the first place."
    },
    {
      image: IMG_BASE + "img-male-placeholder.webp",
      name:"Marcus Bellinger",
      role:"Owner, Bellinger Roofing Co.",
      text:"Storm season used to mean missed calls because our old site was impossible to use on a phone. Now homeowners can request a quote in under a minute from anywhere, and our crew stays booked because the leads keep coming in steadily."
    },
    {
      image: IMG_BASE + "img-female-placeholder.webp",
      name:"Priya Anand",
      role:"Business Coach & Consultant",
      text:"I'd been putting off rebuilding my site for over a year because every quote felt overpriced for what I'd get. This team delivered something that actually sounds like me, and I've had new clients mention the site by name during our first call."
    }
  ];

  const track = document.getElementById('track');
  const dotsWrap = document.getElementById('dots');
  const slideCount = Math.ceil(testimonials.length / 2);
  let current = 0;

  function starRow(){
    return '<div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>';
  }

  function buildCard(t, idx){
    return `
      <div class="card" data-idx="${idx}">
        <div class="card-top">
          <div class="avatar"><img src="${t.image}" alt="${t.name}" loading="lazy"></div>
          <div class="card-copy">
            ${starRow()}
            <p class="quote">${t.text}</p>
            <a class="read-more" data-idx="${idx}">Read more</a>
          </div>
        </div>
        <div class="divider"></div>
        <div class="person">
          <div class="person-name">${t.name}
            <span class="bubble">${t.name}</span>
          </div>
          <div class="person-role">${t.role}</div>
        </div>
      </div>
    `;
  }

  for(let s=0; s<slideCount; s++){
    const slideEl = document.createElement('div');
    slideEl.className = 'slide';
    const pair = testimonials.slice(s*2, s*2+2);
    pair.forEach((t) => {
      const globalIdx = testimonials.indexOf(t);
      slideEl.innerHTML += buildCard(t, globalIdx);
    });
    track.appendChild(slideEl);

    const dot = document.createElement('div');
    dot.className = 'dot' + (s===0 ? ' active' : '');
    dot.dataset.idx = s;
    dot.addEventListener('click', () => userNavigate(s));
    dotsWrap.appendChild(dot);
  }

  function update(){
    track.style.transform = `translateX(-${current * 100}%)`;
    document.querySelectorAll('.dot').forEach((d,i)=>{
      d.classList.toggle('active', i===current);
    });
    if (typeof sendHeightToParent === 'function') {
      setTimeout(sendHeightToParent, 50);
    }
  }

  function goTo(i){
    current = (i + slideCount) % slideCount;
    update();
  }

  // Manual navigation resets the autoplay timer so it doesn't fire
  // right on the heels of a click the person just made.
  function userNavigate(i){
    goTo(i);
    resetAutoplay();
  }

  document.getElementById('prevBtn').addEventListener('click', () => userNavigate(current-1));
  document.getElementById('nextBtn').addEventListener('click', () => userNavigate(current+1));

  // Autoplay
  let autoplayTimer = null;
  function startAutoplay(){
    autoplayTimer = setInterval(() => goTo(current+1), 4000);
  }
  function stopAutoplay(){
    clearInterval(autoplayTimer);
  }
  function resetAutoplay(){
    stopAutoplay();
    startAutoplay();
  }
  startAutoplay();

  // Pause while the person is hovering the carousel or reading a modal
  const carouselEl = document.querySelector('.carousel');
  carouselEl.addEventListener('mouseenter', stopAutoplay);
  carouselEl.addEventListener('mouseleave', startAutoplay);

  // Modal / Read more
  const overlay = document.getElementById('modalOverlay');
  const modalCard = document.getElementById('modalCard');

  function openModal(idx){
    const t = testimonials[idx];
    modalCard.innerHTML = `
      <button class="modal-close" id="modalCloseBtn" aria-label="Close">&times;</button>
      <div class="card-top">
        <div class="avatar"><img src="${t.image}" alt="${t.name}" loading="lazy"></div>
        <div class="card-copy">
          ${starRow()}
          <p class="quote">${t.text}</p>
        </div>
      </div>
      <div class="divider"></div>
      <div class="person">
        <div class="person-name">${t.name}
          <span class="bubble">${t.name}</span>
        </div>
        <div class="person-role">${t.role}</div>
      </div>
    `;
    modalCard.querySelector('#modalCloseBtn').addEventListener('click', closeModal);
    overlay.classList.add('open');
    stopAutoplay();
  }

  function closeModal(){
    overlay.classList.remove('open');
    startAutoplay();
  }

  track.addEventListener('click', (e) => {
    const link = e.target.closest('.read-more');
    if(link){
      openModal(parseInt(link.dataset.idx,10));
    }
  });

  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') closeModal();
  });

  update();

  // Touch support: tap a name to toggle its chat bubble (no real :hover on touchscreens)
  track.addEventListener('click', (e) => {
    const nameEl = e.target.closest('.person-name');
    if (nameEl) {
      const wasOpen = nameEl.classList.contains('show-bubble');
      document.querySelectorAll('.person-name.show-bubble').forEach(el => el.classList.remove('show-bubble'));
      if (!wasOpen) nameEl.classList.add('show-bubble');
    } else if (!e.target.closest('.read-more')) {
      document.querySelectorAll('.person-name.show-bubble').forEach(el => el.classList.remove('show-bubble'));
    }
  });

  // Iframe height is fixed at 460px (no more dynamic auto-resize)
  function sendHeightToParent(){
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(
        { mabTestimonialsHeight: 460 },
        '*'
      );
    }
  }
  window.addEventListener('load', sendHeightToParent);
  window.addEventListener('resize', sendHeightToParent);

  // basic swipe support
  let touchStartX = null;
  track.addEventListener('touchstart', e => touchStartX = e.touches[0].clientX);
  track.addEventListener('touchend', e => {
    if(touchStartX===null) return;
    const diff = e.changedTouches[0].clientX - touchStartX;
    if(diff > 50) userNavigate(current-1);
    else if(diff < -50) userNavigate(current+1);
    touchStartX = null;
  });
</script>
</body>
</html>
